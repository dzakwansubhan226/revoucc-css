<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-glass-bg: rgba(255, 255, 255, 0.12);
            --color-glass-border: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-8 font-sans">

    <!-- Decorative blobs -->
    <div class="fixed top-[-80px] left-[-80px] w-72 h-72 bg-purple-400 rounded-full opacity-30 blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-[-80px] right-[-80px] w-96 h-96 bg-pink-400 rounded-full opacity-30 blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-2xl flex flex-col gap-8">

        <!-- Page title -->
        <h1 class="text-center text-4xl font-bold text-white drop-shadow-lg tracking-wide">
            🍃 HTML Lists
        </h1>

        <!-- Unordered List Card -->
        <div class="rounded-2xl border border-white/25 bg-white/10 backdrop-blur-md shadow-2xl p-8">
            <h2 class="text-xl font-semibold text-white/90 mb-5 flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-pink-300"></span>
                Unordered List (ul)
            </h2>
            <ul class="space-y-3">
                <li class="flex items-center gap-3 text-white/85 text-base">
                    <span class="w-2.5 h-2.5 rounded-full bg-pink-300 shrink-0"></span>
                    Mangga
                </li>
                <li class="flex items-center gap-3 text-white/85 text-base">
                    <span class="w-2.5 h-2.5 rounded-full bg-purple-300 shrink-0"></span>
                    Pisang
                </li>
                <li class="flex items-center gap-3 text-white/85 text-base">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-300 shrink-0"></span>
                    Jambu
                </li>
            </ul>
        </div>

        <!-- Divider -->
        <div class="h-px bg-white/20 rounded-full"></div>

        <!-- Ordered List Card -->
        <div class="rounded-2xl border border-white/25 bg-white/10 backdrop-blur-md shadow-2xl p-8">
            <h2 class="text-xl font-semibold text-white/90 mb-5 flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-indigo-300"></span>
                Ordered List (ol)
            </h2>
            <ol class="space-y-3">
                <li class="flex items-center gap-4 text-white/85 text-base">
                    <span class="w-7 h-7 rounded-full bg-white/20 border border-white/30 flex items-center justify-center text-white text-sm font-bold shrink-0">i</span>
                    Buka Github.com
                </li>
                <li class="flex items-center gap-4 text-white/85 text-base">
                    <span class="w-7 h-7 rounded-full bg-white/20 border border-white/30 flex items-center justify-center text-white text-sm font-bold shrink-0">ii</span>
                    Klik tombol atas plus
                </li>
            </ol>
        </div>

    </div>

</body>
</html>
